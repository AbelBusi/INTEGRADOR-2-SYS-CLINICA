<div class="space-y-2">
  <label class="text-xs font-semibold text-slate-500 uppercase block">{{ label }}</label>
  <div class="flex gap-2 items-stretch flex-wrap sm:flex-nowrap">
    <input
      type="text"
      class="input-field flex-1 font-mono min-w-[10rem]"
      placeholder="8 dígitos"
      maxlength="8"
      inputmode="numeric"
      [ngModel]="dni"
      (ngModelChange)="onDniInput($event)"
      (blur)="onDniBlur()"
      name="dniConsulta"
    />
    <button
      type="button"
      class="btn-secondary shrink-0"
      (click)="consultar()"
      [disabled]="consultando"
    >
      @if (consultando) {
        <span class="h-4 w-4 border-2 border-slate-300 border-t-slate-600 rounded-full animate-spin"></span>
        Consultando...
      } @else {
        <span class="material-icons text-lg">search</span>
        Consultar RENIEC
      }
    </button>
  </div>
  @if (mensaje) {
    <p
      class="text-xs font-medium"
      [class.text-emerald-700]="mensaje.type === 'success'"
      [class.text-red-700]="mensaje.type === 'error'"
      [class.text-amber-700]="mensaje.type === 'warning'"
    >
      {{ mensaje.text }}
    </p>
  }
</div>
