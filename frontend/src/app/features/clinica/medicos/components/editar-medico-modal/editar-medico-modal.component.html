<div *ngIf="isOpen" class="relative z-50">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-lg overflow-hidden rounded bg-white border border-neutral-300">

        <div class="flex justify-between items-start px-6 py-4 bg-[#58595B]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-[#D9182A] flex items-center justify-center shrink-0">
              <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-white">Editar Médico</h3>
          </div>
          <button (click)="handleClose()" [disabled]="guardando" class="p-1.5 rounded text-neutral-300 hover:text-white hover:bg-neutral-700 transition-colors disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        @if (cargandoDatos || !detalle) {
          <div class="flex justify-center items-center py-16">
            <div class="w-8 h-8 border-4 border-gray-200 border-t-[#0d6b68] rounded-full animate-spin"></div>
          </div>
        } @else {

          <form (ngSubmit)="onSubmit()" #editForm="ngForm" class="space-y-4 p-6 max-h-[75vh] overflow-y-auto">

            <div class="flex items-center gap-3 p-3 rounded border border-neutral-200 bg-neutral-50">
              @if (fotoUrl) {
                <img [src]="fotoUrl" [alt]="detalle.nombre" class="w-12 h-12 rounded-full object-cover border border-neutral-300 shrink-0" />
              } @else {
                <div class="w-12 h-12 rounded-full bg-neutral-100 border border-neutral-300 flex items-center justify-center shrink-0">
                  <span class="material-icons text-[#58595B] text-[24px]">person</span>
                </div>
              }

              <div class="min-w-0">
                <p class="text-sm font-bold text-neutral-900 truncate">{{ detalle.nombre }} {{ detalle.apellidos }}</p>
                <p class="text-xs text-neutral-500">{{ detalle.cargo }}</p>
              </div>
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Especialidad</label>
              <select
                name="idEspecialidad"
                [(ngModel)]="medicoForm.idEspecialidad"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors">
                <option [ngValue]="null" disabled>Seleccione...</option>
                @for (especialidad of especialidades; track especialidad.idEspecialidad) {
                  <option [ngValue]="especialidad.idEspecialidad">{{ especialidad.nombre }}</option>
                }
              </select>
            </div>

            <div class="flex items-center justify-between pt-1">
              <span class="text-xs font-bold text-neutral-500 uppercase tracking-wider">Datos profesionales</span>
              <button
                type="button"
                (click)="consultarDatosGuardados()"
                [disabled]="consultando"
                title="Trae desde la base de datos los datos profesionales guardados"
                class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-neutral-600 bg-white hover:bg-neutral-100 rounded border border-neutral-300 transition-colors disabled:opacity-60">
                @if (consultando) {
                  <span class="w-3.5 h-3.5 border-2 border-neutral-300 border-t-[#D9182A] rounded-full animate-spin"></span>
                  Consultando información...
                } @else {
                  <span class="material-icons text-[16px]">manage_search</span>
                  Consultar guardados
                }
              </button>
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">N° de colegiatura (CMP)</label>
              <input
                type="text"
                name="numeroColegiatura"
                [(ngModel)]="medicoForm.numeroColegiatura"
                [readonly]="consultando"
                [class.animate-pulse]="consultando"
                [class.bg-neutral-100]="consultando"
                maxlength="20"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              />
              <div class="text-right text-[10px] text-neutral-400 mt-1">{{ medicoForm.numeroColegiatura.length }}/20</div>
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">
                N° de especialidad (RNE) <span class="normal-case font-medium text-neutral-400">(opcional)</span>
              </label>
              <input
                type="text"
                name="numeroEspecialidad"
                [(ngModel)]="medicoForm.numeroEspecialidad"
                [readonly]="consultando"
                [class.animate-pulse]="consultando"
                [class.bg-neutral-100]="consultando"
                maxlength="20"
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              />
              <div class="text-right text-[10px] text-neutral-400 mt-1">{{ medicoForm.numeroEspecialidad.length }}/20</div>
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">
                Consejo regional <span class="normal-case font-medium text-neutral-400">(opcional)</span>
              </label>
              <select
                name="consejoRegional"
                [(ngModel)]="medicoForm.consejoRegional"
                [disabled]="consultando"
                [class.animate-pulse]="consultando"
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors">
                <option value="">Sin especificar</option>
                @for (consejo of consejos; track consejo) {
                  <option [value]="consejo">{{ consejo }}</option>
                }
              </select>
            </div>

            <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-end gap-2 pt-4 border-t border-neutral-200">
              <button
                type="button"
                (click)="handleClose()"
                [disabled]="guardando"
                class="px-4 py-2 border border-neutral-300 rounded text-sm font-semibold text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 transition-colors disabled:opacity-50"
              >
                Cancelar
              </button>
              <button
                type="submit"
                [disabled]="!editForm.form.valid || guardando"
                class="flex items-center justify-center gap-2 bg-[#D9182A] hover:bg-[#B81424] text-white px-4 py-2 rounded text-sm font-semibold transition-colors disabled:opacity-50"
              >
                <span *ngIf="guardando" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                Guardar Cambios
              </button>
            </div>
          </form>

        }

      </div>
    </div>
  </div>
</div>
