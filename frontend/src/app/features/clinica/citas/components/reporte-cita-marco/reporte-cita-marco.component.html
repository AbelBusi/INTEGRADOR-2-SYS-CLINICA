<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
  (click)="cerrar()">

  <div
    class="flex max-h-[92vh] w-full max-w-6xl flex-col overflow-hidden rounded-lg border border-gray-200 bg-white"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="titulo"
    (click)="$event.stopPropagation()">

    <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
      <div class="flex min-w-0 items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md bg-[#58595B]">
          <span class="material-icons text-[22px] text-white">{{ icono }}</span>
        </div>
        <div class="min-w-0">
          <h2 class="text-base font-bold text-gray-900">{{ titulo }}</h2>
          @if (subtitulo) {
            <p class="truncate text-xs text-gray-500">{{ subtitulo }}</p>
          }
        </div>
      </div>

      <button
        type="button"
        aria-label="Volver"
        [disabled]="generando"
        (click)="cerrar()"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-200 bg-white text-gray-500 transition-colors hover:bg-gray-50 hover:text-[#58595B] disabled:cursor-not-allowed disabled:opacity-40">
        <span class="material-icons text-[20px]">close</span>
      </button>
    </div>

    <div class="min-h-0 flex-1 space-y-5 overflow-y-auto px-5 py-4">
      <ng-content></ng-content>
    </div>

    <div class="flex flex-col gap-3 border-t border-gray-200 bg-[#fafafa] px-5 py-3 lg:flex-row lg:items-center">

      <div class="flex flex-wrap items-center gap-x-5 gap-y-2 lg:mr-auto">

        <div class="inline-flex gap-2">
          @for (item of formatos; track item.valor) {
            <button
              type="button"
              [disabled]="generando"
              (click)="formatoChange.emit(item.valor)"
              [ngClass]="
                formato === item.valor
                  ? 'border-[#D9182A] bg-[#D9182A]/5 text-[#D9182A]'
                  : 'border-gray-300 bg-white text-gray-700 hover:border-[#58595B] hover:bg-gray-50'
              "
              class="inline-flex h-10 items-center justify-center gap-2 rounded-md border px-4 text-sm font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-60">
              <span class="material-icons text-[20px]">{{ item.icono }}</span>
              {{ item.texto }}
            </button>
          }
        </div>

        <ng-content select="[opciones]"></ng-content>

      </div>

      @if (error) {
        <p class="text-xs font-semibold text-[#D9182A]" role="alert">{{ error }}</p>
      }

      <div class="flex flex-col-reverse gap-3 sm:flex-row">
        <button
          type="button"
          [disabled]="generando"
          (click)="cerrar()"
          class="inline-flex h-10 items-center justify-center rounded-md border border-gray-300 bg-white px-4 text-sm font-semibold text-gray-700 transition-colors hover:border-[#58595B] hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-60">
          Volver
        </button>

        <button
          type="button"
          [disabled]="!puedeExportar"
          (click)="exportar.emit()"
          class="inline-flex h-10 items-center justify-center gap-2 rounded-md bg-[#D9182A] px-4 text-sm font-semibold text-white transition-colors hover:bg-[#B81424] disabled:cursor-not-allowed disabled:opacity-60">
          @if (generando) {
            <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
            Generando...
          } @else {
            <span class="material-icons text-[20px]">download</span>
            Generar reporte
          }
        </button>
      </div>

    </div>

  </div>
</div>
