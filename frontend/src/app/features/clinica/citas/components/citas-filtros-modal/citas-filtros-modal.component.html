<div class="relative z-50">

  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex items-center justify-between bg-[#58595B] px-6 py-4">
          <h3 class="flex items-center gap-2.5 text-base font-bold text-white">
            <div class="flex h-7 w-7 items-center justify-center rounded bg-[#D9182A]">
              <span class="material-icons text-[18px] text-white">tune</span>
            </div>
            Filtros avanzados
            @if (cantidadActivos > 0) {
              <span class="rounded bg-white px-2 py-0.5 text-[11px] font-bold text-[#58595B]">
                {{ cantidadActivos }} activo(s)
              </span>
            }
          </h3>
          <button type="button" (click)="handleClose()"
                  class="rounded p-1 text-neutral-300 transition-colors hover:bg-neutral-700 hover:text-white">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1 shrink-0">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit()" class="flex min-h-0 flex-1 flex-col">

          <div class="flex-1 space-y-6 overflow-y-auto p-6">

            <!-- FECHA Y HORARIO -->
            <section class="space-y-3">
              <h4 class="border-b border-neutral-200 pb-1.5 text-sm font-bold text-[#58595B]">Fecha y horario</h4>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Fecha exacta</label>
                  <input type="date" name="fecha" [(ngModel)]="filtros.fecha"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Fecha desde</label>
                  <input type="date" name="fechaDesde" [(ngModel)]="filtros.fechaDesde"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Fecha hasta</label>
                  <input type="date" name="fechaHasta" [(ngModel)]="filtros.fechaHasta"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Turno</label>
                  <select name="turno" [(ngModel)]="filtros.turno"
                          class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]">
                    <option value="">Todos</option>
                    <option value="MANANA">Mañana</option>
                    <option value="TARDE">Tarde</option>
                  </select>
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Hora desde</label>
                  <input type="time" name="horaDesde" [(ngModel)]="filtros.horaDesde"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Hora hasta</label>
                  <input type="time" name="horaHasta" [(ngModel)]="filtros.horaHasta"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Día de la semana</label>
                  <select name="diaSemana" [(ngModel)]="filtros.diaSemana"
                          class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]">
                    <option [ngValue]="null">Todos</option>
                    @for (d of dias; track d.valor) {
                      <option [ngValue]="d.valor">{{ d.texto }}</option>
                    }
                  </select>
                </div>

              </div>
            </section>

            <!-- PACIENTE -->
            <section class="space-y-3">
              <h4 class="border-b border-neutral-200 pb-1.5 text-sm font-bold text-[#58595B]">Paciente</h4>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Nombres o apellidos</label>
                  <input type="text" name="paciente" [(ngModel)]="filtros.paciente" maxlength="100"
                         placeholder="Ej. Juan Pérez"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">N.º de documento</label>
                  <input type="text" name="numeroDocumento" [(ngModel)]="filtros.numeroDocumento" maxlength="15"
                         placeholder="DNI, carnet de extranjería o pasaporte"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

              </div>
            </section>

            <!-- ATENCIÓN MÉDICA -->
            <section class="space-y-3">
              <h4 class="border-b border-neutral-200 pb-1.5 text-sm font-bold text-[#58595B]">Atención médica</h4>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Especialidad</label>
                  <select name="idEspecialidad" [ngModel]="filtros.idEspecialidad ?? null"
                          (ngModelChange)="cambiarEspecialidad($event)"
                          class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]">
                    <option [ngValue]="null">Todas</option>
                    @for (e of especialidades; track e.idEspecialidad) {
                      <option [ngValue]="e.idEspecialidad">{{ e.nombre }}</option>
                    }
                  </select>
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Médico</label>
                  <select name="idMedico" [(ngModel)]="filtros.idMedico" [disabled]="!filtros.idEspecialidad"
                          class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B] disabled:bg-neutral-50 disabled:opacity-60">
                    <option [ngValue]="null">{{ filtros.idEspecialidad ? 'Todos' : 'Elija primero una especialidad' }}</option>
                    @for (m of medicos; track m.idMedico) {
                      <option [ngValue]="m.idMedico">{{ m.nombre }}</option>
                    }
                  </select>
                </div>

              </div>

              <div class="space-y-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Estado de la cita</label>
                <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">

                  @for (op of opcionesEstado; track op.valor) {
                    <label class="flex cursor-pointer items-center gap-3 rounded border p-3 transition-colors"
                           [ngClass]="estadoMarcado(op.valor)
                             ? 'border-[#58595B] bg-neutral-50'
                             : 'border-neutral-300 bg-white hover:bg-neutral-50'">
                      <input type="checkbox" class="accent-[#58595B]"
                             [checked]="estadoMarcado(op.valor)" (change)="alternarEstado(op.valor)" />
                      <span class="text-sm font-semibold text-neutral-800">{{ op.texto }}</span>
                    </label>
                  }

                  <label class="flex cursor-pointer items-center gap-3 rounded border p-3 transition-colors"
                         [ngClass]="filtros.enAtencion
                           ? 'border-[#0d6b68] bg-[#0d6b68]/5'
                           : 'border-neutral-300 bg-white hover:bg-neutral-50'">
                    <input type="checkbox" class="accent-[#0d6b68]"
                           [checked]="!!filtros.enAtencion" (change)="alternarEnAtencion()" />
                    <div>
                      <p class="text-sm font-semibold text-neutral-800">En atención</p>
                      <p class="text-[11px] text-neutral-500">Iniciada y sin finalizar</p>
                    </div>
                  </label>

                </div>
              </div>
            </section>

            <!-- INFORMACIÓN ADMINISTRATIVA -->
            <section class="space-y-3">
              <h4 class="border-b border-neutral-200 pb-1.5 text-sm font-bold text-[#58595B]">Información administrativa</h4>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Registrada por (usuario)</label>
                  <input type="text" name="registradoPor" [(ngModel)]="filtros.registradoPor" maxlength="30"
                         placeholder="Nombre de usuario"
                         class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]" />
                </div>

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">Origen del registro</label>
                  <select name="registroPresencial" [(ngModel)]="filtros.registroPresencial"
                          class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]">
                    <option [ngValue]="null">Todos</option>
                    <option [ngValue]="true">Recepción (presencial)</option>
                    <option [ngValue]="false">Portal web</option>
                  </select>
                </div>

              </div>
            </section>

            @if (error) {
              <div class="rounded border border-[#D9182A]/40 px-3 py-2 text-xs font-medium text-[#D9182A]">
                {{ error }}
              </div>
            }

          </div>

          <div class="flex flex-col-reverse gap-3 border-t border-neutral-200 p-6 sm:flex-row sm:items-center">
            <button type="button" (click)="limpiarTodo()"
                    class="rounded border border-neutral-300 bg-white px-4 py-2 text-sm font-medium text-neutral-600 transition-colors hover:bg-neutral-100 hover:text-neutral-900">
              Limpiar filtros
            </button>
            <div class="flex flex-1 flex-col-reverse gap-3 sm:flex-row sm:justify-end">
              <button type="button" (click)="handleClose()"
                      class="rounded border border-neutral-300 bg-white px-4 py-2 text-sm font-medium text-neutral-600 transition-colors hover:bg-neutral-100 hover:text-neutral-900">
                Cancelar
              </button>
              <button type="submit"
                      class="rounded bg-[#D9182A] px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-[#B81424]">
                Aplicar filtros
              </button>
            </div>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
