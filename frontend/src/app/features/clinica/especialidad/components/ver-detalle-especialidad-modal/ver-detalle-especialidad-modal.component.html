<div *ngIf="especialidad" class="relative z-50">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md overflow-hidden rounded bg-white border border-neutral-300">

        <div class="flex justify-between items-start px-6 py-4 bg-[#58595B]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-[#D9182A] flex items-center justify-center shrink-0">
              <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 10.5V20a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9.5M3 10.5l9-7 9 7M12 12v6m-3-3h6" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-white">Detalle de especialidad</h3>
          </div>
          <button (click)="onClose()" class="p-1.5 rounded text-neutral-300 hover:text-white hover:bg-neutral-700 transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <div class="space-y-4 p-6">
          <div>
            <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Nombre</label>
            <p class="text-sm font-bold text-neutral-900">{{ especialidad.nombre }}</p>
          </div>

          <div>
            <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Descripción</label>
            <p class="text-sm text-neutral-500 leading-relaxed">{{ especialidad.descripcion }}</p>
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-neutral-200">
            <span class="text-xs font-medium text-neutral-400">ID #{{ especialidad.id }}</span>
            <span [ngClass]="{
                'bg-neutral-100 text-[#58595B] border-neutral-300': especialidad.estado === 1,
                'bg-[#D9182A]/10 text-[#D9182A] border-[#D9182A]/30': especialidad.estado !== 1
              }" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold border uppercase tracking-wider">
              {{ especialidad.estado === 1 ? 'Activo' : 'Desactivado' }}
            </span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
