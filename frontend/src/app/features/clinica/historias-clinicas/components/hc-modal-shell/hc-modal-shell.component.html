<div class="relative" [ngClass]="elevado ? 'z-[60]' : 'z-50'">

  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div
        class="flex max-h-[92vh] w-full flex-col overflow-hidden rounded border border-neutral-300 bg-white"
        [ngClass]="ancho">

        <div class="flex shrink-0 items-center justify-between bg-[#58595B] px-6 py-4">
          <div class="flex min-w-0 items-center gap-2.5">
            <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded bg-[#D9182A]">
              <span class="material-icons text-[18px] text-white">{{ icono }}</span>
            </div>
            <div class="min-w-0">
              <h3 class="truncate text-base font-bold text-white">{{ titulo }}</h3>
              @if (subtitulo) {
                <p class="truncate text-xs text-neutral-300">{{ subtitulo }}</p>
              }
            </div>
          </div>

          <button
            type="button"
            (click)="cerrar.emit()"
            class="rounded p-1 text-neutral-300 transition-colors hover:bg-neutral-700 hover:text-white">
            <span class="material-icons text-[20px]">close</span>
          </button>
        </div>

        <div class="flex h-1 shrink-0">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <div class="min-h-0 flex-1 overflow-y-auto">
          <ng-content></ng-content>
        </div>

        <ng-content select="[hc-footer]"></ng-content>

      </div>
    </div>
  </div>
</div>
