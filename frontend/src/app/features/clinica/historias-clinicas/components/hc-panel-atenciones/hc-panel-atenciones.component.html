<app-hc-panel-seccion
  [sinMarco]="sinMarco"
  anclaId="hc-atenciones"
  titulo="Atenciones médicas"
  descripcion="Tus consultas atendidas, de la más reciente a la más antigua."
  icono="medical_services"
  [contador]="cargando || error ? null : atenciones.length">

  @if (error) {

    <div class="flex items-start gap-3 rounded-lg border border-[#D9182A]/30 bg-[#D9182A]/5 px-4 py-3">
      <span class="material-icons text-[20px] text-[#D9182A]">error_outline</span>
      <p class="flex-1 text-sm font-semibold text-[#D9182A]">{{ error }}</p>
      <button
        type="button"
        (click)="reintentar.emit()"
        class="rounded-md border border-gray-300 bg-white px-3 py-1 text-xs font-semibold text-gray-700 transition-colors hover:border-[#58595B] hover:bg-gray-50">
        Reintentar
      </button>
    </div>

  } @else if (cargando) {

    <div class="flex items-center justify-center gap-3 py-8 text-sm text-gray-500">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-gray-300 border-t-[#58595B]"></span>
      Cargando atenciones...
    </div>

  } @else if (atenciones.length === 0) {

    <app-hc-seccion-vacia
      titulo="Aún no tienes atenciones registradas"
      detalle="Aparecerán aquí cuando seas atendido en una cita médica."
      icono="medical_services"
    ></app-hc-seccion-vacia>

  } @else {

    <ol>
      @for (a of lista(); track a.idCita; let ultimo = $last) {
        <li class="relative pl-7" [class.pb-4]="!ultimo">

          @if (!ultimo) {
            <span class="absolute bottom-0 left-[4px] top-4 w-px bg-gray-200"></span>
          }
          <span class="absolute left-0 top-[13px] h-[9px] w-[9px] rounded-full bg-[#58595B]"></span>

          <div class="rounded-md border border-gray-200 bg-white">

            <button
              type="button"
              (click)="alternar(a.idCita)"
              [attr.aria-expanded]="estaAbierta(a.idCita)"
              class="flex w-full items-start gap-3 px-4 py-3 text-left transition-colors hover:bg-gray-50">

              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                  <p class="text-sm font-bold text-gray-900">{{ fecha(a) }}</p>
                  @if (horario(a)) {
                    <span class="text-xs text-gray-500">{{ horario(a) }}</span>
                  }
                  <span class="inline-flex items-center rounded-full border border-gray-200 bg-gray-100 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-gray-600">
                    {{ a.especialidad }}
                  </span>
                </div>

                <p class="mt-0.5 text-sm text-gray-700">{{ a.medico }}</p>

                @if (a.motivo) {
                  <p class="mt-0.5 line-clamp-1 text-xs text-gray-500">Motivo: {{ a.motivo }}</p>
                }

                @if (!estaAbierta(a.idCita) && resumenDiagnostico(a)) {
                  <p class="mt-1 line-clamp-1 text-xs font-medium text-[#0d6b68]">
                    Diagnóstico: {{ resumenDiagnostico(a) }}
                  </p>
                }
              </div>

              <span class="material-icons shrink-0 text-[20px] text-gray-400">
                {{ estaAbierta(a.idCita) ? 'expand_less' : 'expand_more' }}
              </span>
            </button>

            @if (estaAbierta(a.idCita)) {
              <div class="border-t border-gray-200 bg-gray-50 p-4">
                <app-hc-atencion-contenido [atencion]="a"></app-hc-atencion-contenido>
              </div>
            }

          </div>
        </li>
      }
    </ol>

    @if (restantes() > 0) {
      <div class="mt-4 flex justify-center">
        <button
          type="button"
          (click)="mostrarMas()"
          class="h-10 rounded-md border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 transition-colors hover:border-[#58595B] hover:bg-gray-50">
          Mostrar {{ restantes() > porBloque ? porBloque : restantes() }} atenciones más
        </button>
      </div>
    }

  }

</app-hc-panel-seccion>
