<app-hc-modal-shell
  titulo="Detalle de la atención"
  [subtitulo]="subtitulo"
  icono="assignment"
  [elevado]="true"
  ancho="max-w-3xl"
  (cerrar)="cerrar.emit()">

  <div class="space-y-5 p-6">

    <section class="rounded-lg border border-gray-200 bg-white">
      <div class="border-b border-gray-200 px-5 py-3">
        <h4 class="text-xs font-bold uppercase tracking-wide text-[#58595B]">Datos de la atención</h4>
      </div>

      <dl class="grid grid-cols-1 gap-x-6 gap-y-4 px-5 py-4 sm:grid-cols-2">
        <div>
          <dt class="text-[11px] font-semibold uppercase tracking-wide text-gray-500">Fecha de atención</dt>
          <dd class="mt-0.5 text-sm font-medium text-gray-800">{{ fechaTexto(atencion.fechaCita) }}</dd>
        </div>

        <div>
          <dt class="text-[11px] font-semibold uppercase tracking-wide text-gray-500">Horario</dt>
          <dd class="mt-0.5 text-sm font-medium text-gray-800">{{ horario || '-' }}</dd>
        </div>

        <div>
          <dt class="text-[11px] font-semibold uppercase tracking-wide text-gray-500">Médico responsable</dt>
          <dd class="mt-0.5 text-sm font-medium text-gray-800">{{ atencion.medico }}</dd>
        </div>

        <div>
          <dt class="text-[11px] font-semibold uppercase tracking-wide text-gray-500">Especialidad</dt>
          <dd class="mt-0.5 text-sm font-medium text-gray-800">{{ atencion.especialidad }}</dd>
        </div>

        <div class="sm:col-span-2">
          <dt class="text-[11px] font-semibold uppercase tracking-wide text-gray-500">Motivo de consulta</dt>
          <dd class="mt-0.5 text-sm text-gray-800">{{ atencion.motivo || '-' }}</dd>
        </div>
      </dl>
    </section>

    <app-hc-atencion-contenido [atencion]="atencion"></app-hc-atencion-contenido>

  </div>

  <div hc-footer class="flex shrink-0 justify-end border-t border-gray-200 bg-white px-6 py-3">
    <button
      type="button"
      (click)="cerrar.emit()"
      class="h-10 rounded-md border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 transition-colors hover:border-[#58595B] hover:bg-gray-50">
      Cerrar
    </button>
  </div>

</app-hc-modal-shell>
