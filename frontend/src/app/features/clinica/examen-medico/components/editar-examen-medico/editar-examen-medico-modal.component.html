<div *ngIf="isOpen" class="relative z-50">

  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="w-full max-w-md overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex justify-between items-center px-6 py-4 bg-[#58595B]">
          <h3 class="text-base font-bold text-white flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-[#D9182A] flex items-center justify-center">
              <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </div>
            Editar Examen Médico
          </h3>
          <button type="button" (click)="handleClose()"
                  class="p-1 rounded hover:bg-neutral-700 text-neutral-300 hover:text-white transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit()" class="space-y-4 p-6">

          <div class="space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Nombre del
                Examen</label>
              <span class="text-[11px] font-medium text-neutral-400"
                    [class.text-[#D9182A]]="examenForm.nombre.length >= 150">
                {{ examenForm.nombre.length || 0 }}/150
              </span>
            </div>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="examenForm.nombre"
              #nombreInput="ngModel"
              maxlength="150"
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              [class.border-[#D9182A]]="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)"
              placeholder="Ej. Hemograma completo"
              required
            />
            <div *ngIf="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)"
                 class="text-xs text-[#D9182A] font-medium">
              El nombre es obligatorio.
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Tipo de
              Examen</label>
            <select
              name="tipoExamen"
              [(ngModel)]="examenForm.tipoExamen"
              #tipoInput="ngModel"
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              [class.border-[#D9182A]]="tipoInput.invalid && (tipoInput.dirty || tipoInput.touched)"
              required
            >
              <option value="" disabled>Seleccione un tipo</option>
              @for (tipo of tiposExamen; track tipo) {
                <option [value]="tipo">{{ tipo }}</option>
              }
            </select>
            <div *ngIf="tipoInput.invalid && (tipoInput.dirty || tipoInput.touched)"
                 class="text-xs text-[#D9182A] font-medium">
              El tipo de examen es obligatorio.
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-semibold text-[#58595B] uppercase tracking-wider">Descripción
                (opcional)</label>
              <span class="text-[11px] font-medium text-neutral-400"
                    [class.text-[#D9182A]]="examenForm.descripcion.length >= 255">
                {{ examenForm.descripcion.length || 0 }}/255
              </span>
            </div>
            <textarea
              name="descripcion"
              [(ngModel)]="examenForm.descripcion"
              maxlength="255"
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors h-24 resize-none"
              placeholder="Breve descripción del examen..."></textarea>
          </div>

          <div class="flex flex-col-reverse sm:flex-row gap-3 pt-2">
            <button
              type="button"
              (click)="handleClose()"
              class="flex-1 px-4 py-2 text-sm font-medium text-neutral-600 bg-white hover:bg-neutral-100 hover:text-neutral-900 rounded border border-neutral-300 transition-colors">
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="!f.form.valid || guardando"
              class="flex-1 px-4 py-2 text-sm font-semibold text-white bg-[#D9182A] hover:bg-[#B81424] rounded transition-colors disabled:opacity-50">
              Guardar Cambios
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
