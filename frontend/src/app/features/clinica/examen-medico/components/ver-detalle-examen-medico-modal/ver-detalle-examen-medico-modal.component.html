<div class="relative z-50">

  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="w-full max-w-md overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex justify-between items-center px-6 py-4 bg-[#58595B]">
          <h3 class="text-base font-bold text-white flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-[#D9182A] flex items-center justify-center">
              <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </div>
            Detalle del Examen Médico
          </h3>
          <button type="button" (click)="close.emit()"
                  class="p-1 rounded hover:bg-neutral-700 text-neutral-300 hover:text-white transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <div class="space-y-4 p-6">

          <div class="space-y-1">
            <p class="text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Nombre del Examen</p>
            <p class="text-sm font-semibold text-neutral-800">{{ examen.nombre }}</p>
          </div>

          <div class="space-y-1">
            <p class="text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Tipo de Examen</p>
            <p class="text-sm text-neutral-800">{{ examen.tipoExamen }}</p>
          </div>

          <div class="space-y-1">
            <p class="text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Descripción</p>
            <p class="text-sm text-neutral-800 whitespace-pre-line">{{ examen.descripcion || 'Sin descripción' }}</p>
          </div>

          <div class="space-y-1">
            <p class="text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Estado</p>
            <span
              [ngClass]="
                examen.estado === 1
                  ? 'bg-[#0d6b68]/10 text-[#0d6b68] border-[#0d6b68]/20'
                  : 'bg-[#D9182A]/10 text-[#D9182A] border-[#D9182A]/20'
              "
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border uppercase tracking-wide">
              <span class="w-1.5 h-1.5 rounded-full"
                    [ngClass]="examen.estado === 1 ? 'bg-[#0d6b68]' : 'bg-[#D9182A]'"></span>
              {{ examen.estado === 1 ? 'Activo' : 'Desactivado' }}
            </span>
          </div>

          <div class="pt-2">
            <button
              type="button"
              (click)="close.emit()"
              class="w-full px-4 py-2 text-sm font-medium text-neutral-600 bg-white hover:bg-neutral-100 hover:text-neutral-900 rounded border border-neutral-300 transition-colors">
              Cerrar
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
