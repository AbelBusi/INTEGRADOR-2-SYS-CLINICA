<div class="relative z-[60]">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md overflow-hidden rounded bg-white border border-neutral-300">

        <div class="flex justify-between items-start px-6 py-4 bg-[#58595B]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-[#D9182A] flex items-center justify-center shrink-0">
              <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-white">Editar horario</h3>
          </div>
          <button (click)="handleClose()" [disabled]="guardando" class="p-1.5 rounded text-neutral-300 hover:text-white hover:bg-neutral-700 transition-colors disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <form (ngSubmit)="onSubmit()" #editForm="ngForm" class="space-y-4 p-6">

          @if (empleado) {
            <div class="flex items-center gap-2 rounded border border-neutral-200 bg-neutral-50 px-3 py-2">
              <span class="w-2.5 h-2.5 rounded-sm shrink-0" [style.background-color]="empleado.color"></span>
              <span class="text-sm font-bold text-neutral-800 truncate">{{ empleado.nombre }}</span>
              @if (empleado.cargo) {
                <span class="text-xs font-medium text-neutral-500 truncate">· {{ empleado.cargo }}</span>
              }
            </div>
          }

          <div>
            <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Día de la semana</label>
            <select
              name="diaSemana"
              [(ngModel)]="form.diaSemana"
              required
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors">
              @for (dia of dias; track dia.numero) {
                <option [ngValue]="dia.numero">{{ dia.largo }}</option>
              }
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Entrada</label>
              <input
                type="time"
                name="entrada"
                [(ngModel)]="form.entrada"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              />
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Salida</label>
              <input
                type="time"
                name="salida"
                [(ngModel)]="form.salida"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              />
            </div>
          </div>

          @if (errorHoras; as mensaje) {
            <p class="text-[11px] font-medium text-[#D9182A]">{{ mensaje }}</p>
          }

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Vigente desde</label>
              <input
                type="date"
                name="inicio"
                [(ngModel)]="form.inicio"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              />
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Vigente hasta</label>
              <input
                type="date"
                name="fin"
                [(ngModel)]="form.fin"
                [min]="form.inicio"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              />
            </div>
          </div>

          @if (errorVigencia; as mensaje) {
            <p class="text-[11px] font-medium text-[#D9182A]">{{ mensaje }}</p>
          }

          @if (errorCruce; as mensaje) {
            <p class="text-[11px] font-medium text-[#D9182A]">{{ mensaje }}</p>
          }

          <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-end gap-2 pt-4 border-t border-neutral-200">
            <button
              type="button"
              (click)="handleClose()"
              [disabled]="guardando"
              class="px-4 py-2 border border-neutral-300 rounded text-sm font-semibold text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 transition-colors disabled:opacity-50">
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="!formularioValido || guardando"
              class="flex items-center justify-center gap-2 bg-[#D9182A] hover:bg-[#B81424] text-white px-4 py-2 rounded text-sm font-semibold transition-colors disabled:opacity-50">
              <span *ngIf="guardando" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              Guardar Cambios
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
