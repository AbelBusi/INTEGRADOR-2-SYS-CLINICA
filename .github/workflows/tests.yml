name: Tests Backend

on:
  push:
    branches:
      - testing
      - main

  pull_request:
    branches:
      - testing
      - main

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: demo_seguridad
          MARIADB_USER: admin_local
          MARIADB_PASSWORD: 123456789
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn test

      - name: Publicar resultados de pruebas
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Resultados de pruebas JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true