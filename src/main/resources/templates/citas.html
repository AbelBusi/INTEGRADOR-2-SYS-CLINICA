<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Citas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .sidebar {
            height: 100vh;
            background: #1e293b;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            color: #cbd5e1;
            display: block;
            padding: 10px;
            text-decoration: none;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: #334155;
            color: white;
        }

        .topbar {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>Consultorio</h4>
            <hr>

            <a href="#"><i class="fas fa-home"></i> Inicio</a>
            <a href="#"><i class="fas fa-user"></i> Pacientes</a>
            <a href="/citas"><i class="fas fa-calendar"></i> Citas</a>
        </div>

        <!-- CONTENIDO -->
        <div class="col-md-10 p-4">

            <!-- TOPBAR -->
            <div class="topbar mb-4 d-flex justify-content-between">
                <h5>Panel de Citas</h5>
                <span>Admin</span>
            </div>

            <!-- CARDS -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h6>Total Citas</h6>
                        <h3 th:text="${#lists.size(citas)}">0</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h6>Hoy</h6>
                        <h3>5</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 shadow">
                        <h6>Pendientes</h6>
                        <h3>2</h3>
                    </div>
                </div>
            </div>

            <!-- BUSCADOR -->
            <div class="card p-3 shadow mb-3">
                <input type="text" class="form-control" placeholder="Buscar cita...">
            </div>

            <!-- TABLA -->
            <div class="card p-3 shadow">

                <div class="d-flex justify-content-between mb-3">
                    <h5>Lista de Citas</h5>
                    <a th:href="@{/citas/nueva}" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Nueva
                    </a>
                </div>

                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Doctor</th>
                            <th>Fecha</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="cita : ${citas}">
                            <td th:text="${cita.id}"></td>
                            <td th:text="${cita.paciente}"></td>
                            <td th:text="${cita.doctor}"></td>
                            <td th:text="${cita.fecha}"></td>
                            <td class="text-center">
                                <a th:href="@{/citas/editar/{id}(id=${cita.id})}"
                                   class="btn btn-warning btn-sm">
                                   <i class="fas fa-edit"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </div>

    </div>
</div>

</body>
</html>
