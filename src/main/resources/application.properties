spring.application.name=consultorio

# Puerto
server.port=${PORT}

# MariaDB
spring.datasource.url=${DB_DATASOURCE}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect


# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.operationsSorter=method

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Recursos estáticos
spring.mvc.static-path-pattern=/**

# Multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

·Seguridad
aplication.security.jwt.secret=${JWT_SECRET}
aplication.security.jwt.expiration=28800000
aplication.security.jwt.refresh.expiration=28800000

#Protocolo SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

#Protocolo SMPP
textbee.base-url=https://api.textbee.dev/api/v1
textbee.api-key=${TEXTBEE_API_KEY}
textbee.device-id=6ac14e2bb5c1ad28b6396597

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
