<router-outlet></router-outlet>

<!-- Toast Notificación -->
@if (toastService.toast(); as t) {
  <div
    class="fixed top-5 right-5 z-[9999] flex w-[calc(100%-2rem)] max-w-md items-start gap-3 border bg-white px-4 py-4 shadow-md animate-fade-in"
    [ngClass]="{
      'border-[#58595B]/30': t.tipo === 'success',
      'border-red-300': t.tipo === 'error',
      'border-neutral-300': t.tipo === 'info',
      'border-[#D9182A]/50': t.tipo === 'warning'
    }"
  >
    <!-- Indicador lateral -->
    <div
      class="absolute left-0 top-0 h-full w-1"
      [ngClass]="{
  'bg-[#58595B]': t.tipo === 'success',
  'bg-[#D9182A]': t.tipo === 'error' || t.tipo === 'warning',
  'bg-neutral-400': t.tipo === 'info'
}"
    ></div>

    <!-- Icono -->
    <div class="mt-0.5 shrink-0 pl-1">
      <!-- Éxito -->
      <svg
        *ngIf="t.tipo === 'success'"
        class="h-6 w-6 text-[#58595B]"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5 13l4 4L19 7"
        />
      </svg>

      <!-- Error -->
      <svg
        *ngIf="t.tipo === 'error'"
        class="h-6 w-6 text-[#D9182A]"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v4m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"
        />
      </svg>

      <!-- Información -->
      <svg
        *ngIf="t.tipo === 'info'"
        class="h-6 w-6 text-[#58595B]"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 8h.01M11 12h1v4h1m-1-8a9 9 0 110 18 9 9 0 010-18z"
        />
      </svg>

      <!-- Advertencia -->
      <svg
        *ngIf="t.tipo === 'warning'"
        class="h-6 w-6 text-[#D9182A]"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v3m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"
        />
      </svg>
    </div>

    <!-- Contenido -->
    <div class="min-w-0 flex-1">
      <p
        class="text-sm font-bold"
        [ngClass]="{
        'text-[#58595B]': t.tipo === 'success',
        'text-[#D9182A]': t.tipo === 'error' || t.tipo === 'warning',
        'text-neutral-800': t.tipo === 'info'
      }"
      >
        {{
          t.tipo === 'success'
            ? 'Operación realizada'
            : t.tipo === 'error'
              ? 'Error'
              : t.tipo === 'warning'
                ? 'Advertencia'
                : 'Información'
        }}
      </p>

      <p class="mt-1 text-sm leading-5 text-neutral-700">
        {{ t.mensaje }}
      </p>
    </div>

    <!-- Cerrar -->
    <button
      type="button"
      (click)="toastService.toast.set(null)"
      aria-label="Cerrar notificación"
      class="shrink-0 p-1 text-neutral-400 transition-colors hover:bg-neutral-100 hover:text-[#58595B]"
    >
      <svg
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
}


@if (toastService.confirmacion(); as conf) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-neutral-900/45 animate-fade-in"
  >
    <div
      class="mx-4 w-full max-w-md border border-neutral-200 bg-white p-6 shadow-lg"
    >

      <!-- Cabecera -->
      <div class="flex items-start gap-4">

        <!-- Icono -->
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center border border-red-200 bg-red-50 text-[#D9182A]"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>

        <!-- Texto -->
        <div class="min-w-0 flex-1">
          <h3 class="text-base font-bold text-neutral-900">
            {{ conf.titulo }}
          </h3>

          <p class="mt-1.5 text-sm leading-6 text-neutral-600">
            {{ conf.mensaje }}
          </p>
        </div>

      </div>

      <!-- Línea institucional -->
      <div class="mt-5 flex h-1">
        <div class="w-1/2 bg-[#58595B]"></div>
        <div class="w-1/2 bg-[#D9182A]"></div>
      </div>

      <!-- Botones -->
      <div class="mt-5 flex items-center justify-end gap-3">

        <button
          type="button"
          (click)="toastService.cancelarConfirmacion()"
          class="border border-neutral-300 px-5 py-2.5 text-sm font-semibold text-neutral-700 transition-colors hover:bg-neutral-100"
        >
          Cancelar
        </button>

        <button
          type="button"
          (click)="toastService.aceptarConfirmacion()"
          class="bg-[#D9182A] px-5 py-2.5 text-sm font-bold text-white transition-colors hover:bg-[#B91524]"
        >
          Confirmar
        </button>

      </div>
    </div>
  </div>
}
