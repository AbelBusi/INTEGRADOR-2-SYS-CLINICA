@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40" (click)="handleClose()">
    <div class="card w-full max-w-md p-6 space-y-4" (click)="$event.stopPropagation()">
      <h3 class="text-lg font-bold text-slate-800">Nuevo rol</h3>
      @if (error) {
        <p class="text-sm text-red-700 bg-red-50 rounded-lg px-3 py-2">{{ error }}</p>
      }
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-600 mb-1">Nombre *</label>
          <input class="input-field" [(ngModel)]="form.nombre" name="nombre" required maxlength="40" />
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Descripción *</label>
          <textarea
            class="input-field min-h-[80px]"
            [(ngModel)]="form.descripcion"
            name="descripcion"
            required
            maxlength="100"
          ></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" class="btn-secondary" (click)="handleClose()">Cancelar</button>
          <button type="submit" class="btn-primary" [disabled]="guardando">
            {{ guardando ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
