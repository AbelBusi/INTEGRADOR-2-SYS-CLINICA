<div class="animate-fade-in space-y-6">
  <div class="page-header mb-0">
    <h2>Mis Pacientes</h2>
    <p>Pacientes relacionados con tu actividad</p>
  </div>

  <div class="flex items-center gap-2 border-b border-slate-200">
    <button type="button" (click)="cambiarTab('atendidos')"
            class="px-4 py-2 text-sm font-semibold border-b-2 transition-colors"
            [ngClass]="tab() === 'atendidos' ? 'border-[#0d6b68] text-[#0d6b68]' : 'border-transparent text-slate-400 hover:text-slate-600'">
      Atendidos
    </button>
    <button type="button" (click)="cambiarTab('pendientes')"
            class="px-4 py-2 text-sm font-semibold border-b-2 transition-colors"
            [ngClass]="tab() === 'pendientes' ? 'border-[#0d6b68] text-[#0d6b68]' : 'border-transparent text-slate-400 hover:text-slate-600'">
      Pendientes
    </button>
  </div>

  <div class="flex items-center gap-2 bg-white border border-slate-200 rounded px-3 py-2 w-72 shadow-sm">
    <span class="material-icons text-slate-400 text-lg select-none">search</span>
    <input type="text" class="bg-transparent text-sm text-slate-700 placeholder-slate-400 outline-none w-full"
           placeholder="Buscar por nombre o DNI..." [ngModel]="search()" (ngModelChange)="search.set($event)" />
  </div>

  <app-custom-table
    [data]="filtered()"
    [columns]="columnas"
    [loading]="cargando()"
    [sortField]="sortField()"
    (sort)="handleSort($event)">

    <ng-template #customColumn let-row let-field="field">

      @if (field === 'apellidos') {
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-teal-100 border border-teal-200 flex items-center justify-center shrink-0 select-none">
            <span class="text-teal-700 text-xs font-bold">{{ (row.nombre || '?')[0] }}{{ (row.apellidos || '?')[0] }}</span>
          </div>
          <p class="font-bold text-slate-900">{{ row.apellidos }}, {{ row.nombre }}</p>
        </div>
      }

      @if (field === 'dni') {
        <span class="font-mono text-sm text-slate-600">{{ row.dni }}</span>
      }

      @if (field === 'acciones') {
        <button type="button" (click)="$event.stopPropagation(); verHistoria(row)"
                class="p-1.5 text-gray-400 hover:text-sky-600 hover:bg-sky-50 rounded-md transition-colors inline-flex items-center justify-center" title="Historia clínica">
          <span class="material-icons text-xl">history_edu</span>
        </button>
      }

    </ng-template>
  </app-custom-table>
</div>

@if (pacienteHistoria()) {
  <app-historia-clinica-modal
    [pacienteId]="pacienteHistoria()!.id"
    [pacienteNombre]="pacienteHistoria()!.nombre"
    (close)="pacienteHistoria.set(null)">
  </app-historia-clinica-modal>
}
