<div *ngIf="isOpen" class="relative z-50">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md overflow-hidden rounded bg-white border border-neutral-300">

        <div class="flex justify-between items-start px-6 py-4 bg-[#58595B]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-[#D9182A] flex items-center justify-center shrink-0">
              <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-white">Editar Especialidad</h3>
          </div>
          <button (click)="handleClose()" [disabled]="cargando" class="p-1.5 rounded text-neutral-300 hover:text-white hover:bg-neutral-700 transition-colors disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <form (ngSubmit)="onSubmit()" #editForm="ngForm" class="space-y-4 p-6">
          <div>
            <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Nombre</label>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="especialidadForm.nombre"
              required
              maxlength="40"
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
            />
            <div class="text-right text-[10px] text-neutral-400 mt-1">
              {{ especialidadForm.nombre.length }}/40
            </div>
          </div>

          <div>
            <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Descripción</label>
            <textarea
              name="descripcion"
              [(ngModel)]="especialidadForm.descripcion"
              required
              maxlength="100"
              rows="3"
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors resize-none"
            ></textarea>
            <div class="text-right text-[10px] text-neutral-400 mt-1">
              {{ especialidadForm.descripcion.length }}/100
            </div>
          </div>

          <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-end gap-2 pt-4 border-t border-neutral-200">
            <button
              type="button"
              (click)="handleClose()"
              [disabled]="cargando"
              class="px-4 py-2 border border-neutral-300 rounded text-sm font-semibold text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 transition-colors disabled:opacity-50"
            >
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="!editForm.form.valid || cargando"
              class="flex items-center justify-center gap-2 bg-[#D9182A] hover:bg-[#B81424] text-white px-4 py-2 rounded text-sm font-semibold transition-colors disabled:opacity-50"
            >
              <span *ngIf="cargando" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              Guardar Cambios
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
