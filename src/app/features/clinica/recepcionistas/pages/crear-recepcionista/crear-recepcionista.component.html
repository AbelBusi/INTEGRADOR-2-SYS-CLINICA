<div class="grid grid-cols-1 gap-6 relative">

  @if (isSaving) {
    <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[100] flex flex-col items-center justify-center gap-3 animate-fade-in">
      <div class="bg-white p-6 rounded border border-gray-200 shadow-xl flex flex-col items-center gap-4 max-w-xs w-full">
        <div class="h-8 w-8 border-4 border-gray-200 border-t-[#0d6b68] rounded-full animate-spin"></div>
        <div class="text-center">
          <p class="text-xs font-bold text-gray-800 uppercase tracking-wider">Guardando Registro</p>
          <p class="text-[11px] text-gray-500 mt-1">Redireccionando al listado...</p>
        </div>
      </div>
    </div>
  }

  <div class="lg:col-span-2 space-y-6">
    <form (ngSubmit)="handleSubmit()" class="space-y-4" novalidate>

      <div class="bg-[#fdfdfd] border border-gray-200 rounded p-6 shadow-sm">
        <h3 class="text-xs font-bold text-gray-700 flex items-center gap-2 mb-4 border-b border-gray-100 pb-3 uppercase tracking-wider">
          <span class="material-icons text-base text-[#0d6b68] select-none">badge</span>
          Validación RENIEC
        </h3>
        <div class="p-4 rounded bg-slate-50 border border-slate-100">
          <app-consulta-dni
            [dni]="form.persona.dni"
            (dniChange)="form.persona.dni = $event"
            (datosCargados)="onDatosReniec($event)"
          />
        </div>
      </div>

      <div class="bg-[#fdfdfd] border border-gray-200 rounded p-6 shadow-sm space-y-4">
        <h3 class="text-xs font-bold text-gray-700 flex items-center gap-2 border-b border-gray-100 pb-3 uppercase tracking-wider">
          <span class="material-icons text-base text-[#0d6b68] select-none">person</span>
          Información Personal
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Nombres *</label>
            <input type="text" name="nombre" [(ngModel)]="form.persona.nombre" required maxlength="70" [disabled]="isSaving"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors disabled:bg-gray-50" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Apellidos *</label>
            <input type="text" name="apellidos" [(ngModel)]="form.persona.apellidos" required maxlength="100" [disabled]="isSaving"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors disabled:bg-gray-50" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Género *</label>
            <select name="genero" [(ngModel)]="form.persona.genero" [disabled]="isSaving"
                    class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white accent-[#0d6b68] hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium cursor-pointer transition-colors disabled:bg-gray-50">
              @for (g of generos; track g) {
                <option [value]="g">{{ g }}</option>
              }
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Fecha de Nacimiento</label>
            <input type="date" name="fechaNacimiento" [(ngModel)]="form.persona.fechaNacimiento" [disabled]="isSaving"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors disabled:bg-gray-50" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Teléfono</label>
            <input type="text" name="telefono" [(ngModel)]="form.persona.telefono" maxlength="9" pattern="\d{9}" placeholder="999999999" [disabled]="isSaving"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors disabled:bg-gray-50" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Correo Electrónico</label>
            <input type="email" name="correo" [(ngModel)]="form.persona.correo" maxlength="100" placeholder="correo@ejemplo.com" [disabled]="isSaving"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors disabled:bg-gray-50" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Nacionalidad</label>
            <input type="text" name="nacionalidad" [(ngModel)]="form.persona.nacionalidad" maxlength="50" [disabled]="isSaving"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors disabled:bg-gray-50" />
          </div>
        </div>
      </div>

      <div class="bg-[#fdfdfd] border border-gray-200 rounded p-6 shadow-sm space-y-4">
        <h3 class="text-xs font-bold text-gray-700 flex items-center gap-2 border-b border-gray-100 pb-3 uppercase tracking-wider">
          <span class="material-icons text-base text-[#0d6b68] select-none">work</span>
          Datos Laborales
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Código de Empleado *</label>
            <input type="text" name="codigoEmpleado" [(ngModel)]="form.codigoEmpleado" required maxlength="25" placeholder="REC-2026-001" [disabled]="isSaving"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] font-mono text-gray-800 font-bold tracking-tight transition-colors disabled:bg-gray-50" />
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="submit" [disabled]="loading || isSaving"
                class="flex items-center gap-2 px-5 py-2 bg-[#0d6b68] text-white text-xs font-bold rounded hover:bg-[#0a5452] shadow-sm transition-colors uppercase tracking-wider disabled:opacity-40 disabled:cursor-not-allowed">
          <span class="material-icons text-sm select-none">
            {{ loading ? 'sync' : 'person_add' }}
          </span>
          {{ loading ? 'Registrando...' : 'Registrar Recepcionista' }}
        </button>
      </div>
    </form>
  </div>
</div>
