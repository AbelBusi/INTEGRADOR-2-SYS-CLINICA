@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-none" (click)="handleClose()">
    <div
      class="relative bg-white rounded-md border border-gray-300 shadow-[2px_2px_0px_0px_rgba(0,0,0,0.05)] w-full max-w-lg mx-4 overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <div class="bg-[#0d6b68] px-6 py-4 flex items-center justify-between border-b border-gray-200/10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded bg-white/10 border border-white/10 flex items-center justify-center text-white select-none">
            <span class="material-icons text-xl">schedule</span>
          </div>
          <div>
            <h3 class="text-white font-bold text-base tracking-tight">Nuevo Horario</h3>
            <p class="text-gray-200/80 text-xs mt-0.5">Defina el horario de trabajo del trabajador</p>
          </div>
        </div>
        <button type="button" (click)="handleClose()" class="text-gray-200/70 hover:text-white hover:bg-white/10 p-1.5 rounded transition-colors">
          <span class="material-icons block text-xl">close</span>
        </button>
      </div>

      <form (ngSubmit)="onSubmit()" class="p-6 space-y-4" novalidate>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Tipo *</label>
            <select name="tipo" [ngModel]="form.tipo" (ngModelChange)="onTipoChange($event)"
                    class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium cursor-pointer transition-colors">
              <option value="DOCTOR">Doctor</option>
              <option value="RECEPCIONISTA">Recepcionista</option>
            </select>
          </div>

          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Persona *</label>
            <select name="referenciaId" [(ngModel)]="form.referenciaId"
                    class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium cursor-pointer transition-colors">
              <option [ngValue]="0" disabled>Seleccione una persona</option>
              @for (p of personas; track p.id) {
                <option [ngValue]="p.id">{{ p.nombre }}</option>
              }
            </select>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Día de la semana *</label>
          <select name="diaSemana" [(ngModel)]="form.diaSemana"
                  class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium cursor-pointer transition-colors">
            @for (d of dias; track d.valor) {
              <option [ngValue]="d.valor">{{ d.nombre }}</option>
            }
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Hora de inicio *</label>
            <input type="time" name="horaInicio" [(ngModel)]="form.horaInicio"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Hora de fin *</label>
            <input type="time" name="horaFin" [(ngModel)]="form.horaFin"
                   class="w-full text-xs px-3 py-2 border border-gray-200 rounded bg-white hover:border-[#0d6b68] focus:outline-none focus:border-[#0d6b68] text-gray-800 font-medium transition-colors" />
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" (click)="handleClose()" [disabled]="guardando"
                  class="px-4 py-2 text-xs font-semibold text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded transition-colors disabled:opacity-40">
            Cancelar
          </button>
          <button type="submit" [disabled]="guardando"
                  class="flex items-center gap-2 px-5 py-2 text-xs bg-[#0d6b68] text-white rounded hover:bg-[#0a5452] transition-colors font-bold uppercase tracking-wider shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
            <span class="material-icons text-sm">{{ guardando ? 'sync' : 'save' }}</span>
            {{ guardando ? 'Guardando...' : 'Guardar Horario' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
