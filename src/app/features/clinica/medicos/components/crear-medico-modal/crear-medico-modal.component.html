<div *ngIf="isOpen" class="relative z-50">

  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="w-full max-w-lg overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex justify-between items-center px-6 py-4 bg-[#58595B]">
          <h3 class="text-base font-bold text-white flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-[#D9182A] flex items-center justify-center">
              <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </div>
            Nuevo Médico
          </h3>
          <button (click)="handleClose()" [disabled]="guardando" class="p-1 rounded hover:bg-neutral-700 text-neutral-300 hover:text-white transition-colors disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        @if (cargandoCatalogos) {
          <div class="flex justify-center items-center py-16">
            <div class="w-8 h-8 border-4 border-gray-200 border-t-[#0d6b68] rounded-full animate-spin"></div>
          </div>
        } @else {

          <form #f="ngForm" (ngSubmit)="onSubmit()" class="space-y-4 p-6 max-h-[75vh] overflow-y-auto">

            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Empleado</label>
              <select
                name="idEmpleado"
                [(ngModel)]="medicoForm.idEmpleado"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors">
                <option [ngValue]="null" disabled>Seleccione un empleado...</option>
                @for (empleado of empleados; track empleado.idEmpleado) {
                  <option [ngValue]="empleado.idEmpleado">{{ empleado.nombre }}</option>
                }
              </select>
              @if (empleados.length === 0) {
                <div class="text-xs text-neutral-500 font-medium">
                  No hay empleados con cargo de personal médico disponibles.
                </div>
              }
            </div>

            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Especialidad</label>
              <select
                name="idEspecialidad"
                [(ngModel)]="medicoForm.idEspecialidad"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors">
                <option [ngValue]="null" disabled>Seleccione una especialidad...</option>
                @for (especialidad of especialidades; track especialidad.idEspecialidad) {
                  <option [ngValue]="especialidad.idEspecialidad">{{ especialidad.nombre }}</option>
                }
              </select>
            </div>

            <div class="flex items-center justify-between pt-1">
              <span class="text-xs font-bold text-neutral-500 uppercase tracking-wider">Datos profesionales</span>
              @if (esDesarrollo) {
                <button
                  type="button"
                  (click)="generarCodigosUnicos()"
                  [disabled]="generando"
                  title="Solo desarrollo: genera códigos aleatorios y verifica que no existan en la BD"
                  class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-neutral-600 bg-white hover:bg-neutral-100 rounded border border-neutral-300 transition-colors disabled:opacity-60">
                  @if (generando) {
                    <span class="w-3.5 h-3.5 border-2 border-neutral-300 border-t-[#D9182A] rounded-full animate-spin"></span>
                    Consultando información...
                  } @else {
                    <span class="material-icons text-[16px]">auto_fix_high</span>
                    Consultar Informacion
                  }
                </button>
              }
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">N° de colegiatura (CMP)</label>
                <span class="text-[11px] font-medium text-neutral-400" [class.text-[#D9182A]]="medicoForm.numeroColegiatura.length >= 20">
      {{ medicoForm.numeroColegiatura.length }}/20
    </span>
              </div>
              <input
                type="text"
                name="numeroColegiatura"
                [(ngModel)]="medicoForm.numeroColegiatura"
                [readonly]="generando"
                [class.animate-pulse]="generando"
                [class.bg-neutral-100]="generando"
                maxlength="20"
                required
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
                placeholder="Ej. 045678"
              />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">
                  N° de especialidad (RNE) <span class="normal-case font-medium text-neutral-400">(opcional)</span>
                </label>
                <span class="text-[11px] font-medium text-neutral-400" [class.text-[#D9182A]]="medicoForm.numeroEspecialidad.length >= 20">
      {{ medicoForm.numeroEspecialidad.length }}/20
    </span>
              </div>
              <input
                type="text"
                name="numeroEspecialidad"
                [(ngModel)]="medicoForm.numeroEspecialidad"
                [readonly]="generando"
                [class.animate-pulse]="generando"
                [class.bg-neutral-100]="generando"
                maxlength="20"
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
                placeholder="Ej. RNE-12345"
              />
            </div>

            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">
                Consejo regional <span class="normal-case font-medium text-neutral-400">(opcional)</span>
              </label>
              <select
                name="consejoRegional"
                [(ngModel)]="medicoForm.consejoRegional"
                [disabled]="generando"
                [class.animate-pulse]="generando"
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors">
                <option value="">Sin especificar</option>
                @for (consejo of consejos; track consejo) {
                  <option [value]="consejo">{{ consejo }}</option>
                }
              </select>
            </div>

            <div class="flex flex-col-reverse sm:flex-row gap-3 pt-2">
              <button
                type="button"
                (click)="handleClose()"
                [disabled]="guardando"
                class="flex-1 px-4 py-2 text-sm font-medium text-neutral-600 bg-white hover:bg-neutral-100 hover:text-neutral-900 rounded border border-neutral-300 transition-colors disabled:opacity-50">
                Cancelar
              </button>
              <button
                type="submit"
                [disabled]="!f.form.valid || guardando"
                class="flex-1 flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-[#D9182A] hover:bg-[#B81424] rounded transition-colors disabled:opacity-50">
                <span *ngIf="guardando" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                Guardar Médico
              </button>
            </div>
          </form>

        }

      </div>
    </div>
  </div>
</div>
