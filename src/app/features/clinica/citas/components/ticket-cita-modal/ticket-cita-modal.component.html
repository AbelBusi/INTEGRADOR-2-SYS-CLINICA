<div class="relative z-[60]">
  <div class="fixed inset-0 bg-neutral-900/60"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex items-center justify-between bg-[#58595B] px-6 py-4">
          <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded bg-[#D9182A]">
              <span class="material-icons text-[20px] text-white">receipt_long</span>
            </div>
            <h3 class="text-base font-bold text-white">Ticket de la cita</h3>
          </div>
          <button
            type="button"
            (click)="onClose()"
            class="rounded p-1.5 text-neutral-300 transition-colors hover:bg-neutral-700 hover:text-white">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <div class="max-h-[68vh] overflow-y-auto bg-[#ececec]">
          <iframe #marco title="Ticket de la cita" class="block w-full border-0" style="min-height: 480px"></iframe>
        </div>

        <div class="flex flex-col-reverse gap-2 border-t border-neutral-200 p-4 sm:flex-row sm:justify-end">
          <button
            type="button"
            (click)="onClose()"
            class="rounded border border-neutral-300 px-4 py-2 text-sm font-semibold text-neutral-600 transition-colors hover:bg-neutral-100 hover:text-neutral-900">
            Cerrar
          </button>
          <button
            type="button"
            (click)="imprimir()"
            class="flex items-center justify-center gap-2 rounded bg-[#D9182A] px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-[#B81424]">
            <span class="material-icons text-[18px]">print</span>
            Imprimir ticket
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
