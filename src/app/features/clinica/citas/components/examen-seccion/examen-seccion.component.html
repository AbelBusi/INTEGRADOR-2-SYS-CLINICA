<section class="rounded-md border border-gray-200 bg-white">

  <div class="flex items-center justify-between gap-2 border-b border-gray-200 px-4 py-2.5">
    <div class="flex items-center gap-2">
      <span class="material-icons text-[20px] text-[#58595B]">science</span>
      <h4 class="text-sm font-bold text-gray-800">Exámenes solicitados</h4>
      <span class="rounded-full bg-gray-100 px-2 py-0.5 text-[11px] font-bold text-gray-600">{{ examenes.length }}</span>
    </div>
    <button
      type="button"
      (click)="alternarFormulario()"
      class="inline-flex h-8 items-center gap-1.5 rounded-md border border-gray-300 bg-white px-3 text-xs font-semibold text-gray-700 transition-colors hover:border-[#58595B] hover:bg-gray-50">
      <span class="material-icons text-[16px]">{{ mostrarFormulario() ? 'close' : 'add' }}</span>
      {{ mostrarFormulario() ? 'Cancelar' : 'Agregar' }}
    </button>
  </div>

  @if (examenes.length === 0 && !mostrarFormulario()) {
    <p class="px-4 py-3 text-sm text-gray-500">Sin exámenes solicitados.</p>
  }

  <ul class="divide-y divide-gray-100">
    @for (e of examenes; track e.id) {
      <li class="px-4 py-3">
        <p class="text-sm text-gray-700">{{ e.motivo }}</p>
      </li>
    }
  </ul>

  @if (mostrarFormulario()) {
    <form
      [formGroup]="form"
      (ngSubmit)="guardar()"
      class="space-y-3 border-t border-gray-200 bg-gray-50 px-4 py-3">

      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-600">Motivo del examen</label>
        <textarea
          formControlName="motivo"
          rows="2"
          maxlength="200"
          placeholder="Examen requerido y justificación"
          class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 outline-none placeholder-gray-400 focus:border-[#58595B] focus:ring-1 focus:ring-[#58595B]"></textarea>
      </div>

      <div class="flex justify-end">
        <button
          type="submit"
          [disabled]="form.invalid || guardando()"
          class="inline-flex h-9 items-center gap-2 rounded-md bg-[#58595B] px-4 text-sm font-semibold text-white transition-colors hover:bg-neutral-700 disabled:cursor-not-allowed disabled:opacity-50">
          <span class="material-icons text-[18px]">save</span>
          {{ guardando() ? 'Guardando...' : 'Guardar examen' }}
        </button>
      </div>

    </form>
  }

</section>
