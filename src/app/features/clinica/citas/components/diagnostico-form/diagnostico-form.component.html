<form
  [formGroup]="form"
  (ngSubmit)="guardar()"
  class="grid grid-cols-1 gap-4 border border-neutral-200 border-t-2 border-t-[#D9182A] bg-white p-4 sm:p-5 md:grid-cols-3">

  <div>
    <label class="mb-1.5 block text-sm font-semibold text-neutral-700">Código (CIE-10)</label>
    <input
      type="text"
      formControlName="codigo"
      maxlength="15"
      placeholder="Ej. J00"
      class="h-10 w-full border border-neutral-300 bg-white px-3 text-sm text-neutral-800 outline-none placeholder:text-neutral-400 focus:border-[#D9182A] focus:ring-1 focus:ring-[#D9182A]"
    />
  </div>

  <div class="md:col-span-2">
    <label class="mb-1.5 block text-sm font-semibold text-neutral-700">Descripción</label>
    <input
      type="text"
      formControlName="descripcion"
      maxlength="300"
      placeholder="Descripción del diagnóstico"
      class="h-10 w-full border border-neutral-300 bg-white px-3 text-sm text-neutral-800 outline-none placeholder:text-neutral-400 focus:border-[#D9182A] focus:ring-1 focus:ring-[#D9182A]"
    />
  </div>

  <div>
    <label class="mb-1.5 block text-sm font-semibold text-neutral-700">Tipo de diagnóstico</label>
    <select
      formControlName="tipoDiagnostico"
      class="h-10 w-full border border-neutral-300 bg-white px-3 text-sm text-neutral-800 outline-none focus:border-[#D9182A] focus:ring-1 focus:ring-[#D9182A]">
      <option [ngValue]="null" disabled>Seleccione...</option>
      @for (tipo of tipos; track tipo.valor) {
        <option [ngValue]="tipo.valor">{{ tipo.texto }}</option>
      }
    </select>
  </div>

  <div class="md:col-span-2">
    <label class="mb-1.5 block text-sm font-semibold text-neutral-700">Observaciones</label>
    <textarea
      formControlName="observaciones"
      rows="2"
      maxlength="300"
      placeholder="Observaciones clínicas"
      class="w-full resize-y border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 outline-none placeholder:text-neutral-400 focus:border-[#D9182A] focus:ring-1 focus:ring-[#D9182A]"></textarea>
  </div>

  <div class="flex flex-wrap justify-end gap-2 border-t border-neutral-200 pt-4 md:col-span-3">
    <button
      type="button"
      (click)="cancelar.emit()"
      [disabled]="guardando()"
      class="h-10 border border-neutral-300 bg-white px-4 text-sm font-semibold text-neutral-700 hover:border-neutral-400 hover:bg-neutral-100 disabled:cursor-not-allowed disabled:opacity-50">
      Cancelar
    </button>
    <button
      type="submit"
      [disabled]="form.invalid || guardando()"
      class="inline-flex h-10 items-center justify-center gap-2 bg-[#D9182A] px-4 text-sm font-semibold text-white hover:bg-[#B91524] disabled:cursor-not-allowed disabled:opacity-50">
      <span class="material-icons text-[18px]">save</span>
      {{ guardando() ? 'Guardando...' : 'Guardar diagnóstico' }}
    </button>
  </div>

</form>
