<div *ngIf="cita" class="relative z-50">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-lg overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex items-start justify-between bg-[#58595B] px-6 py-4">
          <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded bg-[#D9182A]">
              <span class="material-icons text-[20px] text-white">event_note</span>
            </div>
            <h3 class="text-base font-bold text-white">Detalle de la cita</h3>
          </div>
          <button
            type="button"
            (click)="onClose()"
            class="rounded p-1.5 text-neutral-300 transition-colors hover:bg-neutral-700 hover:text-white">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <div class="space-y-5 p-6">

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <div>
              <label class="mb-1 block text-[10px] font-bold uppercase tracking-wider text-[#D9182A]">Paciente</label>
              <p class="text-sm font-bold text-neutral-900">{{ cita.paciente }}</p>
            </div>

            <div>
              <label class="mb-1 block text-[10px] font-bold uppercase tracking-wider text-[#D9182A]">Médico</label>
              <p class="text-sm font-bold text-neutral-900">{{ cita.medico }}</p>
            </div>

            <div>
              <label class="mb-1 block text-[10px] font-bold uppercase tracking-wider text-[#D9182A]">Fecha</label>
              <p class="text-sm text-neutral-600">{{ fecha }}</p>
            </div>

            <div>
              <label class="mb-1 block text-[10px] font-bold uppercase tracking-wider text-[#D9182A]">Horario</label>
              <p class="text-sm text-neutral-600">{{ cita.inicio }} - {{ cita.salida }} ({{ duracion }})</p>
            </div>

            <div class="sm:col-span-2">
              <label class="mb-1 block text-[10px] font-bold uppercase tracking-wider text-[#D9182A]">Motivo</label>
              <p class="text-sm leading-relaxed text-neutral-600">{{ cita.motivo }}</p>
            </div>

          </div>

          <div class="flex items-center justify-between border-t border-neutral-200 pt-4">
            <span class="text-xs font-medium text-neutral-400">ID #{{ cita.id }}</span>
            <span
              class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wider"
              [ngClass]="estado.clases">
              <span class="h-1.5 w-1.5 rounded-full" [ngClass]="estado.punto"></span>
              {{ estado.texto }}
            </span>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
