<div class="relative z-50">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-lg overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex items-center justify-between bg-[#58595B] px-6 py-4">
          <h3 class="flex items-center gap-2.5 text-base font-bold text-white">
            <div
              class="flex h-7 w-7 items-center justify-center rounded"
              [ngClass]="variante === 'peligro' ? 'bg-[#D9182A]' : 'bg-[#0d6b68]'">
              <span class="material-icons text-[18px] text-white">{{ icono }}</span>
            </div>
            {{ titulo }}
          </h3>
          <button
            type="button"
            (click)="onClose()"
            [disabled]="procesando"
            class="rounded p-1 text-neutral-300 transition-colors hover:bg-neutral-700 hover:text-white disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <form (ngSubmit)="onConfirmar()" class="space-y-4 p-6">

          @if (descripcion) {
            <p class="text-sm text-neutral-600">{{ descripcion }}</p>
          }

          <div class="space-y-2 rounded border border-neutral-200 bg-neutral-50 px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="material-icons text-[18px] text-[#58595B]">person</span>
              <span class="text-sm font-bold text-neutral-900">{{ cita.paciente }}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="material-icons text-[18px] text-[#58595B]">medical_services</span>
              <span class="text-sm text-neutral-700">{{ cita.medico }}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="material-icons text-[18px] text-[#58595B]">schedule</span>
              <span class="text-sm text-neutral-700">
                {{ fechaCorta(cita.fecha) }} · {{ cita.inicio }} - {{ cita.salida }}
              </span>
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-semibold uppercase tracking-wider text-[#D9182A]">{{ etiquetaCampo }}</label>
              <span
                class="text-[11px] font-medium text-neutral-400"
                [class.text-[#D9182A]]="observacion().length >= MAX">
                {{ observacion().length }}/{{ MAX }}
              </span>
            </div>
            <textarea
              name="observacion"
              [ngModel]="observacion()"
              (ngModelChange)="observacion.set($event)"
              [maxlength]="MAX"
              rows="3"
              [placeholder]="placeholder"
              class="w-full resize-none rounded border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none transition-colors hover:border-[#58595B] focus:border-[#58595B]"></textarea>
          </div>

          <div class="flex flex-col-reverse items-stretch justify-end gap-2 border-t border-neutral-200 pt-4 sm:flex-row sm:items-center">
            <button
              type="button"
              (click)="onClose()"
              [disabled]="procesando"
              class="rounded border border-neutral-300 px-4 py-2 text-sm font-semibold text-neutral-600 transition-colors hover:bg-neutral-100 hover:text-neutral-900 disabled:opacity-50">
              Volver
            </button>
            <button
              type="submit"
              [disabled]="procesando"
              class="flex items-center justify-center gap-2 rounded px-4 py-2 text-sm font-semibold text-white transition-colors disabled:opacity-50"
              [ngClass]="variante === 'peligro' ? 'bg-[#D9182A] hover:bg-[#B81424]' : 'bg-[#0d6b68] hover:bg-[#0a5855]'">
              @if (procesando) {
                <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
              }
              {{ textoConfirmar }}
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
