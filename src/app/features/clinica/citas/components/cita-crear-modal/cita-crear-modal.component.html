<div class="relative z-50">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-5xl overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex items-center justify-between bg-[#58595B] px-6 py-4">
          <h3 class="flex items-center gap-2.5 text-base font-bold text-white">
            <div class="flex h-7 w-7 items-center justify-center rounded bg-[#D9182A]">
              <span class="material-icons text-[18px] text-white">event</span>
            </div>
            Nueva cita
          </h3>
          <button
            type="button"
            (click)="onClose()"
            [disabled]="guardando()"
            class="rounded p-1 text-neutral-300 transition-colors hover:bg-neutral-700 hover:text-white disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <app-cita-formulario [form]="this" textoGuardar="Guardar cita"></app-cita-formulario>

      </div>
    </div>
  </div>
</div>
