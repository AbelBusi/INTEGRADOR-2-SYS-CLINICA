<div class="overflow-hidden border border-neutral-200 border-t-2 border-t-[#D9182A] bg-white">

  <button
    type="button"
    (click)="alternar.emit()"
    class="flex w-full items-start gap-3 px-4 py-4 text-left hover:bg-neutral-50">

    <div class="flex h-10 w-10 shrink-0 items-center justify-center bg-[#58595B]">
      <span class="material-icons text-[20px] text-white">assignment</span>
    </div>

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-2">
        <span class="border border-neutral-200 bg-neutral-100 px-2 py-1 text-xs font-bold text-neutral-800">
          {{ detalle.diagnostico.codigo }}
        </span>
        <span class="inline-flex items-center border border-[#D9182A]/30 bg-red-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wide text-[#B91524]">
          {{ etiquetaTipo(detalle.diagnostico.tipoDiagnostico) }}
        </span>
        <span class="text-xs text-neutral-500">
          {{ detalle.diagnostico.fecDiagnostico | date: 'dd/MM/yyyy HH:mm' }}
        </span>
      </div>
      <p class="mt-1.5 text-sm font-bold text-neutral-900">{{ detalle.diagnostico.descripcion }}</p>
      <p class="mt-1 text-xs leading-5 text-neutral-500">
        {{ detalle.tratamientos.length }} tratamientos ·
        {{ detalle.indicaciones.length }} indicaciones ·
        {{ detalle.examenesSolicitados.length }} exámenes ·
        {{ detalle.derivaciones.length }} derivaciones
      </p>
    </div>

    <span class="material-icons shrink-0 text-[22px] text-neutral-500">
      {{ expandido ? 'expand_less' : 'expand_more' }}
    </span>
  </button>

  @if (expandido) {
    <div class="space-y-4 border-t border-neutral-200 bg-white px-4 py-4">

      <div class="border-l-2 border-l-[#D9182A] bg-neutral-50 px-3 py-3">
        <p class="text-xs font-bold uppercase tracking-wide text-neutral-600">Observaciones clínicas</p>
        <p class="mt-1 text-sm leading-6 text-neutral-800">{{ detalle.diagnostico.observaciones }}</p>
      </div>

      <app-tratamiento-seccion
        [idDiagnostico]="detalle.diagnostico.id"
        [tratamientos]="detalle.tratamientos"
        [soloLectura]="soloLectura"
        (creado)="cambio.emit()"
      ></app-tratamiento-seccion>

      <app-indicacion-seccion
        [idDiagnostico]="detalle.diagnostico.id"
        [indicaciones]="detalle.indicaciones"
        [soloLectura]="soloLectura"
        (creado)="cambio.emit()"
      ></app-indicacion-seccion>

      <app-examen-seccion
        [idDiagnostico]="detalle.diagnostico.id"
        [examenes]="detalle.examenesSolicitados"
        [soloLectura]="soloLectura"
        (creado)="cambio.emit()"
      ></app-examen-seccion>

      <app-derivacion-seccion
        [idDiagnostico]="detalle.diagnostico.id"
        [derivaciones]="detalle.derivaciones"
        [soloLectura]="soloLectura"
        (creado)="cambio.emit()"
      ></app-derivacion-seccion>

    </div>
  }

</div>
