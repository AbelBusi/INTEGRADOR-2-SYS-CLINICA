<div *ngIf="isOpen" class="relative z-50">

  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="w-full max-w-md overflow-hidden rounded border border-neutral-300 bg-white">

        <div class="flex justify-between items-center px-6 py-4 bg-[#58595B]">
          <h3 class="text-base font-bold text-white flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-[#D9182A] flex items-center justify-center">
              <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </div>
            Nuevo Cargo
          </h3>
          <button (click)="handleClose()"
                  class="p-1 rounded hover:bg-neutral-700 text-neutral-300 hover:text-white transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit()" class="space-y-4 p-6">

          <div class="space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Nombre del
                Cargo</label>
              <span class="text-[11px] font-medium text-neutral-400"
                    [class.text-[#D9182A]]="cargoForm.nombre.length >= 40">
                {{ cargoForm.nombre.length || 0 }}/40
              </span>
            </div>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="cargoForm.nombre"
              #nombreInput="ngModel"
              maxlength="40"
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors"
              [class.border-[#D9182A]]="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)"
              placeholder="Ej. Administrador"
              required
            />
            <div *ngIf="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)"
                 class="text-xs text-[#D9182A] font-medium">
              El nombre es obligatorio.
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">Descripción</label>
              <span class="text-[11px] font-medium text-neutral-400"
                    [class.text-[#D9182A]]="cargoForm.descripcion.length >= 100">
                {{ cargoForm.descripcion.length || 0 }}/100
              </span>
            </div>
            <textarea
              name="descripcion"
              [(ngModel)]="cargoForm.descripcion"
              #descInput="ngModel"
              maxlength="100"
              class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-800 placeholder-neutral-400 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors h-24 resize-none"
              [class.border-[#D9182A]]="descInput.invalid && (descInput.dirty || descInput.touched)"
              placeholder="Breve descripción del cargo..."
              required></textarea>
            <div *ngIf="descInput.invalid && (descInput.dirty || descInput.touched)"
                 class="text-xs text-[#D9182A] font-medium">
              La descripción es obligatoria.
            </div>
          </div>

          <div class="space-y-2">

            <label class="block text-xs font-semibold text-[#D9182A] uppercase tracking-wider">
              ¿Es personal médico?
            </label>

            <div class="grid grid-cols-2 gap-3">

              <label
                class="flex items-center gap-3 p-3 rounded border cursor-pointer transition-colors"
                [ngClass]="
        cargoForm.esPersonalMedico
          ? 'border-[#0d6b68] bg-[#0d6b68]/5'
          : 'border-neutral-300 bg-white hover:bg-neutral-50'
      "
              >
                <input
                  type="radio"
                  name="esPersonalMedico"
                  [value]="true"
                  [(ngModel)]="cargoForm.esPersonalMedico"
                  class="accent-[#0d6b68]"
                />

                <div>
                  <p class="text-sm font-semibold text-neutral-800">
                    Sí
                  </p>
                  <p class="text-[11px] text-neutral-500">
                    Es personal médico
                  </p>
                </div>
              </label>

              <label
                class="flex items-center gap-3 p-3 rounded border cursor-pointer transition-colors"
                [ngClass]="
        !cargoForm.esPersonalMedico
          ? 'border-[#58595B] bg-neutral-50'
          : 'border-neutral-300 bg-white hover:bg-neutral-50'
      "
              >
                <input
                  type="radio"
                  name="esPersonalMedico"
                  [value]="false"
                  [(ngModel)]="cargoForm.esPersonalMedico"
                  class="accent-[#58595B]"
                />

                <div>
                  <p class="text-sm font-semibold text-neutral-800">
                    No
                  </p>
                  <p class="text-[11px] text-neutral-500">
                    No es personal médico
                  </p>
                </div>
              </label>

            </div>

          </div>

          <div class="flex flex-col-reverse sm:flex-row gap-3 pt-2">
            <button
              type="button"
              (click)="handleClose()"
              class="flex-1 px-4 py-2 text-sm font-medium text-neutral-600 bg-white hover:bg-neutral-100 hover:text-neutral-900 rounded border border-neutral-300 transition-colors">
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="!f.form.valid"
              class="flex-1 px-4 py-2 text-sm font-semibold text-white bg-[#D9182A] hover:bg-[#B81424] rounded transition-colors disabled:opacity-50">
              Guardar Cargo
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
