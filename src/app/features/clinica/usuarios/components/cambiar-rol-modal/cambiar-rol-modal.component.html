<div *ngIf="usuario" class="relative z-50">
  <div class="fixed inset-0 bg-neutral-900/50"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md overflow-hidden rounded bg-white border border-neutral-300">

        <div class="flex justify-between items-start px-6 py-4 bg-[#58595B]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-[#D9182A] flex items-center justify-center shrink-0">
              <span class="material-icons text-white text-[20px]">admin_panel_settings</span>
            </div>
            <h3 class="text-base font-bold text-white">Cambiar rol</h3>
          </div>
          <button (click)="onClose()" [disabled]="guardando()" class="p-1.5 rounded text-neutral-300 hover:text-white hover:bg-neutral-700 transition-colors disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex h-1">
          <div class="w-1/2 bg-[#58595B]"></div>
          <div class="w-1/2 bg-[#D9182A]"></div>
        </div>

        @if (cargando()) {
          <div class="flex justify-center items-center py-14">
            <div class="w-8 h-8 border-4 border-gray-200 border-t-[#0d6b68] rounded-full animate-spin"></div>
          </div>
        } @else {

          <form (ngSubmit)="guardar()" class="space-y-4 p-6">

            <div class="rounded border border-neutral-200 bg-neutral-50 px-4 py-3">
              <p class="text-sm font-bold text-neutral-900">{{ usuario.persona }}</p>
              <p class="mt-0.5 text-xs text-neutral-500">
                <span class="font-mono">{{ usuario.nombreUsuario }}</span>
                · Rol actual:
                <span class="font-bold uppercase text-neutral-700">{{ usuario.rol }}</span>
              </p>
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-[#D9182A] tracking-wider block mb-1">Nuevo rol</label>
              <select
                name="idRol"
                [ngModel]="idRol()"
                (ngModelChange)="idRol.set($event)"
                class="w-full bg-white border border-neutral-300 rounded px-3 py-2 text-sm text-neutral-700 outline-none hover:border-[#58595B] focus:border-[#58595B] transition-colors">
                <option [ngValue]="null" disabled>Seleccione un rol...</option>
                @for (rol of rolesDisponibles(); track rol.idRol) {
                  <option [ngValue]="rol.idRol">
                    {{ rol.nombre }}{{ rol.idRol === idRolActual() ? ' (actual)' : '' }}
                  </option>
                }
              </select>
            </div>

            <div class="flex items-start gap-2 rounded border border-amber-300 bg-amber-50 px-3 py-2.5">
              <span class="material-icons text-[18px] text-amber-700 mt-px">info</span>
              <p class="text-xs leading-5 text-amber-800">
                Al guardar, se cerrará la sesión actual de este usuario y deberá iniciar sesión de nuevo para usar los permisos del nuevo rol.
              </p>
            </div>

            <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-end gap-2 pt-4 border-t border-neutral-200">
              <button
                type="button"
                (click)="onClose()"
                [disabled]="guardando()"
                class="px-4 py-2 border border-neutral-300 rounded text-sm font-semibold text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 transition-colors disabled:opacity-50">
                Cancelar
              </button>
              <button
                type="submit"
                [disabled]="!hayCambio() || guardando()"
                class="flex items-center justify-center gap-2 bg-[#D9182A] hover:bg-[#B81424] text-white px-4 py-2 rounded text-sm font-semibold transition-colors disabled:opacity-50">
                @if (guardando()) {
                  <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                }
                Guardar rol
              </button>
            </div>

          </form>

        }

      </div>
    </div>
  </div>
</div>
